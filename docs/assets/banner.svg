<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KubeHero — one pane of glass for Kubernetes cost, efficiency, and control">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1c1c1c" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="320" fill="#0a0a0a"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" fill="none" stroke="#262626" stroke-width="1"/>

  <!-- status bar -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#525252">
    <text x="24" y="34">/// KUBEHERO — PLATFORM</text>
    <text x="1256" y="34" text-anchor="end">APACHE-2.0 + BSL-1.1 · SELF-HOSTED</text>
  </g>
  <line x1="24" y1="46" x2="1256" y2="46" stroke="#262626" stroke-width="1"/>

  <!-- wordmark -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">
    <text x="24" y="150" font-size="64" font-weight="700" letter-spacing="2" fill="#fafafa">KUBEHERO</text>
    <text x="24" y="192" font-size="20" fill="#a3a3a3">One pane of glass for Kubernetes cost, efficiency, and control.</text>
    <text x="24" y="248" font-size="14" fill="#525252">$ helm install kubehero oci://ghcr.io/kubehero-io/charts/kubehero</text>
    <g font-size="12" fill="#737373">
      <text x="24" y="292">[ EKS ]</text>
      <text x="100" y="292">[ GKE ]</text>
      <text x="176" y="292">[ AKS ]</text>
      <text x="252" y="292">[ eBPF telemetry ]</text>
      <text x="404" y="292">[ spend ceilings ]</text>
      <text x="548" y="292">[ GPU waste ]</text>
    </g>
  </g>

  <!-- pod grid: cluster state motif -->
  <g transform="translate(872, 78)">
    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" fill="#525252">
      <text x="0" y="-10">cluster/prod-eu-1 · burn $412/h</text>
    </g>
    <!-- rows of pods: green ok, amber warn, red over-ceiling -->
    <g>
      <rect x="0"   y="0"  width="24" height="24" fill="#16a34a" opacity="0.85"/>
      <rect x="30"  y="0"  width="24" height="24" fill="#16a34a" opacity="0.7"/>
      <rect x="60"  y="0"  width="24" height="24" fill="#16a34a" opacity="0.85"/>
      <rect x="90"  y="0"  width="24" height="24" fill="#404040"/>
      <rect x="120" y="0"  width="24" height="24" fill="#16a34a" opacity="0.6"/>
      <rect x="150" y="0"  width="24" height="24" fill="#16a34a" opacity="0.85"/>
      <rect x="180" y="0"  width="24" height="24" fill="#404040"/>
      <rect x="210" y="0"  width="24" height="24" fill="#16a34a" opacity="0.75"/>
      <rect x="240" y="0"  width="24" height="24" fill="#16a34a" opacity="0.9"/>
      <rect x="270" y="0"  width="24" height="24" fill="#16a34a" opacity="0.5"/>
      <rect x="300" y="0"  width="24" height="24" fill="#404040"/>
      <rect x="330" y="0"  width="24" height="24" fill="#16a34a" opacity="0.8"/>

      <rect x="0"   y="30" width="24" height="24" fill="#16a34a" opacity="0.7"/>
      <rect x="30"  y="30" width="24" height="24" fill="#d97706" opacity="0.9"/>
      <rect x="60"  y="30" width="24" height="24" fill="#16a34a" opacity="0.85"/>
      <rect x="90"  y="30" width="24" height="24" fill="#16a34a" opacity="0.6"/>
      <rect x="120" y="30" width="24" height="24" fill="#404040"/>
      <rect x="150" y="30" width="24" height="24" fill="#d97706" opacity="0.75"/>
      <rect x="180" y="30" width="24" height="24" fill="#16a34a" opacity="0.85"/>
      <rect x="210" y="30" width="24" height="24" fill="#16a34a" opacity="0.5"/>
      <rect x="240" y="30" width="24" height="24" fill="#404040"/>
      <rect x="270" y="30" width="24" height="24" fill="#16a34a" opacity="0.9"/>
      <rect x="300" y="30" width="24" height="24" fill="#16a34a" opacity="0.7"/>
      <rect x="330" y="30" width="24" height="24" fill="#16a34a" opacity="0.85"/>

      <rect x="0"   y="60" width="24" height="24" fill="#404040"/>
      <rect x="30"  y="60" width="24" height="24" fill="#16a34a" opacity="0.8"/>
      <rect x="60"  y="60" width="24" height="24" fill="#dc2626" opacity="0.95"/>
      <rect x="90"  y="60" width="24" height="24" fill="#dc2626" opacity="0.8"/>
      <rect x="120" y="60" width="24" height="24" fill="#16a34a" opacity="0.7"/>
      <rect x="150" y="60" width="24" height="24" fill="#16a34a" opacity="0.85"/>
      <rect x="180" y="60" width="24" height="24" fill="#404040"/>
      <rect x="210" y="60" width="24" height="24" fill="#16a34a" opacity="0.6"/>
      <rect x="240" y="60" width="24" height="24" fill="#16a34a" opacity="0.9"/>
      <rect x="270" y="60" width="24" height="24" fill="#d97706" opacity="0.8"/>
      <rect x="300" y="60" width="24" height="24" fill="#16a34a" opacity="0.75"/>
      <rect x="330" y="60" width="24" height="24" fill="#16a34a" opacity="0.85"/>

      <rect x="0"   y="90" width="24" height="24" fill="#16a34a" opacity="0.85"/>
      <rect x="30"  y="90" width="24" height="24" fill="#16a34a" opacity="0.6"/>
      <rect x="60"  y="90" width="24" height="24" fill="#404040"/>
      <rect x="90"  y="90" width="24" height="24" fill="#16a34a" opacity="0.8"/>
      <rect x="120" y="90" width="24" height="24" fill="#16a34a" opacity="0.9"/>
      <rect x="150" y="90" width="24" height="24" fill="#404040"/>
      <rect x="180" y="90" width="24" height="24" fill="#16a34a" opacity="0.7"/>
      <rect x="210" y="90" width="24" height="24" fill="#16a34a" opacity="0.85"/>
      <rect x="240" y="90" width="24" height="24" fill="#d97706" opacity="0.7"/>
      <rect x="270" y="90" width="24" height="24" fill="#16a34a" opacity="0.8"/>
      <rect x="300" y="90" width="24" height="24" fill="#404040"/>
      <rect x="330" y="90" width="24" height="24" fill="#16a34a" opacity="0.9"/>
    </g>
    <!-- ceiling annotation on the red pods -->
    <rect x="58" y="58" width="58" height="28" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <text x="60" y="146" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" fill="#dc2626">ceiling tripped → evict</text>
  </g>
</svg>

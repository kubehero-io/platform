version: v2
# Plugin versions are pinned so `buf generate` is reproducible (CI fails
# when committed generated code is stale). Bump deliberately.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.15.0
    out: gen/ts
    opt: target=ts
  - remote: buf.build/connectrpc/es:v1.6.1
    out: gen/ts
    opt: target=ts

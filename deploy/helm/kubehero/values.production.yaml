# KubeHero — recommended production overlay.
#
# Usage:
#   helm upgrade --install kubehero kubehero/kubehero \
#     -f values.production.yaml \
#     -f values.<your-cluster>.yaml
#
# Layer your env-specific overrides on top (DB endpoints, image tags,
# secrets references, ingress hostnames). Everything below is the safe
# baseline a production install should not run without.

# ─── HA replicas ──────────────────────────────────────────────────────────
controlPlane:
  replicas: 3
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: 4,    memory: 2Gi }
  # Never serve demo fixtures; authenticated API only.
  demoMode: "false"
  auth:
    requireAuth: true

dashboard:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

operator:
  replicas: 2  # leader-elect picks one; the other waits

# ─── Schedule above customer workloads ────────────────────────────────────
priorityClass:
  create: true
  value: 1000000000

# ─── Default-deny network policies + tight pod security ───────────────────
networkPolicies:
  enabled: true

podDisruptionBudget:
  enabled: true

# ─── HPA on control-plane + dashboard ─────────────────────────────────────
autoscaling:
  enabled: true
  controlPlane:
    minReplicas: 3
    maxReplicas: 12
    targetCPU: 70
    targetMemory: 75
  dashboard:
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 70

# ─── Storage: managed Postgres + ClickHouse (DSNs in Secrets) ─────────────
#   kubectl create secret generic kubehero-postgres \
#     --from-literal=url='postgres://kubehero:…@pg.internal:5432/kubehero?sslmode=verify-full'
#   kubectl create secret generic kubehero-clickhouse \
#     --from-literal=url='clickhouse://kubehero:…@ch.internal:9440/kubehero?secure=true'
postgresql:
  embedded: false
  external:
    existingSecret: kubehero-postgres
clickhouse:
  embedded: false
  external:
    existingSecret: kubehero-clickhouse

# ─── Never serve demo fixtures; authenticated API only ────────────────────
# ─── Auth via OIDC; embedded Dex off, point at your issuer ────────────────
# controlPlane.auth.oidc.issuerURL / audience / groupRoles in your
# env-specific overlay.
auth:
  dex:
    embedded: false

# ─── Posture: turn on Trivy ingest in production ──────────────────────────
security:
  trivy:
    embedded: false   # consume an existing Trivy Operator install

# ─── Strict pod security context ──────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

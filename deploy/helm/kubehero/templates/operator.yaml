{{- if .Values.operator.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubehero.fullname" . }}-operator
  labels: {{- include "kubehero.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "kubehero.fullname" . }}-operator
      {{- with (include "kubehero.priorityClassName" .) }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if gt (int .Values.operator.replicas) 1 }}
      affinity: {{- include "kubehero.antiAffinity" (dict "component" "operator") | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "kubehero.image" (dict "root" . "image" .Values.operator.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--leader-elect", "--health-probe-bind-address=:8081"]
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext: {{- include "kubehero.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
          env:
            # When CONTROL_PLANE_URL is set, the operator's CeilingPolicy
            # reconciler asks the cp's GetBurnRate RPC (which reads
            # ClickHouse) instead of the stub-zero provider — that is
            # what lets a policy trip in the demo flow. Omitting it
            # (operator.controlPlane.enabled=false) leaves enforcement
            # dry-run: policies can never trip. CLUSTER_ID stamps audit
            # events as they're emitted.
            {{- if .Values.operator.controlPlane.enabled }}
            - name: CONTROL_PLANE_URL
              value: {{ .Values.operator.controlPlane.url | default (include "kubehero.controlPlaneURL" .) | quote }}
            {{- end }}
            - name: CLUSTER_ID
              value: {{ .Values.cluster.id | default .Release.Name | quote }}
            {{- with .Values.cluster.labels }}
            # Matched by RightsizingPolicy spec.scope.clusterSelector.
            - name: CLUSTER_LABELS
              value: {{ include "kubehero.labelString" . | quote }}
            {{- end }}
            - name: CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubehero.clusterTokenSecret" . }}
                  key: {{ include "kubehero.clusterTokenKey" . }}
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}

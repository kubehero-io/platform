{{- if .Values.networkPolicies.enabled }}
{{- $fullname := include "kubehero.fullname" . }}
{{- $name := .Chart.Name }}
# Default-deny for the release namespace with explicit allows per
# component. Requires a CNI that enforces NetworkPolicy.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  labels: {{- include "kubehero.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-dns
  labels: {{- include "kubehero.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- if .Values.controlPlane.enabled }}
---
# Control plane: RPC from every KubeHero client, Prometheus scrapes, and
# (with ingress on) external agents / CLI through the ingress controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-control-plane
  labels: {{- include "kubehero.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: control-plane }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        {{- range list "dashboard" "collector" "operator" "advisor" }}
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: {{ . }} }
        {{- end }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
        {{- if .Values.ingress.enabled }}
        # Ingress controllers live in their own namespaces.
        - namespaceSelector: {}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    # Postgres / ClickHouse (embedded pods or external endpoints).
    - ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 9000 }
        - { protocol: TCP, port: 9440 }
        - { protocol: TCP, port: 8123 }
        - { protocol: TCP, port: 8443 }
    # OIDC JWKS, cloud pricing APIs, alert webhooks (Slack, PagerDuty,
    # Opsgenie, Teams, Alertmanager …).
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 9093 }
{{- end }}
{{- if .Values.collector.enabled }}
---
# Collector: egress is open on purpose — it scrapes pprof endpoints on
# arbitrary pod ports, calls the API server, the control plane and the
# pricing engine. Ingress: metrics scrapes only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-collector
  labels: {{- include "kubehero.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: collector }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { protocol: TCP, port: {{ .Values.collector.service.port }} }
  egress:
    - {}
{{- end }}
{{- if .Values.operator.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-operator
  labels: {{- include "kubehero.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: operator }
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: control-plane }
      ports:
        - { protocol: TCP, port: 8080 }
    # Kubernetes API server
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
{{- end }}
{{- if .Values.advisor.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-advisor
  labels: {{- include "kubehero.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: advisor }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: dashboard }
        {{- if .Values.ingress.enabled }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.advisor.service.port }} }
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: control-plane }
      ports:
        - { protocol: TCP, port: 8080 }
    # Anthropic API (only used when an API key is configured).
    - ports:
        - { protocol: TCP, port: 443 }
{{- end }}
{{- if .Values.dashboard.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-dashboard
  labels: {{- include "kubehero.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: dashboard }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - {}   # ingress controller / port-forward — scope with your own policies
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: control-plane }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: advisor }
      ports:
        - { protocol: TCP, port: {{ .Values.advisor.service.port }} }
{{- end }}
{{- if .Values.pricingEngine.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-pricing-engine
  labels: {{- include "kubehero.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: pricing-engine }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: collector }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: control-plane }
      ports:
        - { protocol: TCP, port: {{ .Values.pricingEngine.service.port }} }
  egress:
    - ports:
        - { protocol: TCP, port: 443 }   # AWS / GCP / Azure price lists
{{- end }}
{{- if and .Values.controlPlane.enabled (or .Values.postgresql.embedded .Values.clickhouse.embedded) }}
---
# Embedded stores: reachable from the control plane only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-stores
  labels: {{- include "kubehero.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [postgres, clickhouse] }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: control-plane }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 9000 }
        - { protocol: TCP, port: 8123 }
  egress: []
{{- end }}
{{- end }}

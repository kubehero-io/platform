{{- if and .Values.prometheus.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule") .Values.chargeback.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kubehero.fullname" . }}-chargeback
  labels:
    {{- include "kubehero.labels" . | nindent 4 }}
    release: {{ .Values.prometheus.release | quote }}
    {{- with .Values.prometheus.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kubehero.chargeback.recording
      interval: 1m
      rules:
        # The collector exports kubehero_pod_cost_usd_per_second as a
        # GAUGE (the pod's current $/second, one series per pod on the
        # collector's node) with labels namespace, pod, workload, team,
        # cost_center, nodepool, cloud, region, cluster [, gpu_kind].
        # Dollars over a period = average rate × seconds, so these
        # rules use avg_over_time — never rate(), which is for counters.
        - record: kubehero:pod_cost_usd:per_minute
          expr: sum by (cluster, namespace, workload, pod, team, cost_center, nodepool, cloud, region, gpu_kind) (avg_over_time(kubehero_pod_cost_usd_per_second[1m])) * 60

        # Team-level rollup — the headline chargeback number, $/hour.
        - record: kubehero:team_cost_usd:per_hour
          expr: sum by (team) (avg_over_time(kubehero_pod_cost_usd_per_second[5m])) * 3600

        - record: kubehero:team_cost_usd:per_day
          expr: sum by (team) (avg_over_time(kubehero_pod_cost_usd_per_second[5m])) * 86400

        - record: kubehero:team_cost_usd:per_month
          expr: sum by (team) (avg_over_time(kubehero_pod_cost_usd_per_second[5m])) * 86400 * 30

        # Nodepool-level rollup — what each pool costs across all teams.
        - record: kubehero:nodepool_cost_usd:per_hour
          expr: sum by (cluster, nodepool, cloud, region) (avg_over_time(kubehero_pod_cost_usd_per_second[5m])) * 3600

        # Cost-center / BU rollup.
        - record: kubehero:cost_center_cost_usd:per_hour
          expr: sum by (cost_center) (avg_over_time(kubehero_pod_cost_usd_per_second[5m])) * 3600

        # Whole-node spend (includes idle capacity no pod requested).
        - record: kubehero:cluster_node_cost_usd:per_hour
          expr: sum by (cluster) (avg_over_time(kubehero_node_cost_usd_per_hour[5m]))

        # Recoverable spend: requested-but-unused capacity, priced.
        - record: kubehero:team_recoverable_usd:per_hour
          expr: sum by (team) (avg_over_time(kubehero_pod_recoverable_usd_per_second[5m])) * 3600

    - name: kubehero.chargeback.alerting
      rules:
        - alert: KubeHeroTeamOverBudgetProjected
          expr: |
            predict_linear(kubehero:team_cost_usd:per_day[6h], 86400 * 30)
              > on(team) group_left
            kubehero_team_budget_usd
          for: 15m
          labels: { severity: warning, team_scope: "true" }
          annotations:
            summary: "Team {{`{{ $labels.team }}`}} on track to exceed monthly budget"
            runbook: "https://docs.kubehero.io/chargeback#over-budget-projection"
{{- end }}

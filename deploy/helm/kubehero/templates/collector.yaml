{{- if .Values.collector.enabled -}}
{{- $fullname := include "kubehero.fullname" . }}
{{- $c := .Values.collector }}
# The node agent. One pod per node; each reports ONLY its own node's pods
# (NODE_NAME) — cost, measured usage, container logs, pprof profiles and
# eBPF flows / CPU samples. Cluster-scoped scans (pending pods, Warning
# events) run on one elected leader (Lease in this namespace).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $fullname }}-collector
  labels: {{- include "kubehero.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: collector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: collector
      {{- with $c.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $fullname }}-collector
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "kubehero.priorityClassName" .) }}
      priorityClassName: {{ . }}
      {{- end }}
      tolerations: {{- toYaml $c.tolerations | nindent 8 }}
      # /proc/<pid> of every container: CPU-profile symbolisation and
      # cgroup → container attribution.
      hostPID: {{ $c.ebpf.enabled }}
      containers:
        - name: collector
          image: {{ include "kubehero.image" (dict "root" . "image" $c.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --addr=:{{ $c.service.port }}
            - --demo=false
            - --logs={{ $c.logs.enabled }}
            - --logs-root=/var/log/pods
            - --logs-positions={{ $c.hostPaths.state }}/log-positions.json
            - --logs-from={{ $c.logs.startFrom }}
            - --logs-rate-limit={{ $c.logs.rateLimit }}
            {{- with $c.logs.excludeNamespaces }}
            - --logs-exclude-namespaces={{ join "," . }}
            {{- end }}
            - --ebpf={{ $c.ebpf.enabled }}
            - --ebpf-netflow={{ $c.ebpf.netflow }}
            - --ebpf-profiler={{ $c.ebpf.profiler }}
            - --ebpf-profile-hz={{ $c.ebpf.profileHz }}
            - --cgroup-root=/sys/fs/cgroup
            - --profiles={{ $c.profiling.scrape }}
            - --profile-interval={{ $c.profiling.interval }}
            - --usage-interval={{ $c.usageInterval }}
            - --events={{ $c.events }}
            {{- with $c.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: GOMEMLIMIT
              valueFrom: { resourceFieldRef: { resource: limits.memory, divisor: "1" } }
            - name: CLUSTER_ID
              value: {{ .Values.cluster.id | default .Release.Name | quote }}
            - name: CONTROL_PLANE_URL
              value: {{ include "kubehero.controlPlaneURL" . | quote }}
            - name: CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubehero.clusterTokenSecret" . }}
                  key: {{ include "kubehero.clusterTokenKey" . }}
            {{- if .Values.pricingEngine.enabled }}
            - name: PRICING_ENGINE_URL
              value: {{ printf "http://%s-pricing-engine.%s.svc:%v" $fullname .Release.Namespace .Values.pricingEngine.service.port | quote }}
            {{- end }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $c.service.port }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            # Root inside the container: pod log files and the checkpoint
            # directory on the host are root-owned (the image's default
            # user is 65532).
            runAsUser: 0
            {{- if $c.ebpf.enabled }}
            # Loading BPF programs, perf events and attaching to the root
            # cgroup require a privileged container.
            privileged: true
            readOnlyRootFilesystem: true
            {{- else }}
            # Logs + kubelet stats only: read-only root, no privileges
            # beyond reading host log files.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
            {{- end }}
          resources: {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: state
              mountPath: {{ $c.hostPaths.state }}
            {{- if $c.ebpf.enabled }}
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pod-logs
          hostPath: { path: {{ $c.hostPaths.logs }}, type: DirectoryOrCreate }
        - name: state
          hostPath: { path: {{ $c.hostPaths.state }}, type: DirectoryOrCreate }
        {{- if $c.ebpf.enabled }}
        - name: cgroup
          hostPath: { path: {{ $c.hostPaths.cgroup }}, type: Directory }
        - name: tracefs
          hostPath: { path: /sys/kernel/tracing }
        - name: debugfs
          hostPath: { path: /sys/kernel/debug }
        {{- end }}
        - name: tmp
          emptyDir: {}
---
# Headless Service so the ServiceMonitor can find every collector pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-collector
  labels:
    {{- include "kubehero.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: collector
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
{{- end }}

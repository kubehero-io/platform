{{- $fullname := include "kubehero.fullname" . }}
{{- /*
  Generated credentials. Values are random on first install and reused
  on every upgrade (lookup), so tokens handed to users keep working.
  Bring your own via controlPlane.existingSecret /
  postgresql.external.existingSecret / clickhouse.external.existingSecret.
*/}}
{{- if and .Values.controlPlane.enabled (not .Values.controlPlane.existingSecret) }}
{{- $name := printf "%s-control-plane" $fullname }}
{{- $admin := include "kubehero.persistentRandom" (dict "root" . "secret" $name "key" "admin-token" "length" 40) }}
{{- $service := include "kubehero.persistentRandom" (dict "root" . "secret" $name "key" "service-token" "length" 40) }}
{{- $cluster := include "kubehero.persistentRandom" (dict "root" . "secret" $name "key" "cluster-token" "length" 40) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "kubehero.labels" . | nindent 4 }}
  annotations:
    # Keep credentials (and the audit signing key) across uninstall /
    # reinstall so exported audit trails stay verifiable.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Signs every audit-log row (HMAC) so a SIEM can verify exports.
  audit-hmac-key: {{ include "kubehero.persistentRandom" (dict "root" . "secret" $name "key" "audit-hmac-key" "length" 48) | quote }}
  # For humans + the CLI: kubectl get secret … -o jsonpath='{.data.admin-token}' | base64 -d
  admin-token: {{ $admin | quote }}
  # Dashboard + advisor → control plane.
  service-token: {{ $service | quote }}
  # This cluster's collector + operator → control plane.
  cluster-token: {{ $cluster | quote }}
  # Dashboard session-cookie HMAC key.
  session-secret: {{ include "kubehero.persistentRandom" (dict "root" . "secret" $name "key" "session-secret" "length" 64) | quote }}
  api-keys: {{ printf "%s:admin,%s:admin,%s:member" $admin $service $cluster | quote }}
{{- end }}
{{- if and .Values.postgresql.embedded .Values.controlPlane.enabled }}
{{- $name := printf "%s-postgres" $fullname }}
{{- $pw := include "kubehero.persistentRandom" (dict "root" . "secret" $name "key" "password" "length" 32) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "kubehero.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: kubehero
  password: {{ $pw | quote }}
  database: kubehero
  url: {{ printf "postgres://kubehero:%s@%s-postgres.%s.svc:5432/kubehero?sslmode=disable" $pw $fullname .Release.Namespace | quote }}
{{- end }}
{{- if and .Values.clickhouse.embedded .Values.controlPlane.enabled }}
{{- $name := printf "%s-clickhouse" $fullname }}
{{- $pw := include "kubehero.persistentRandom" (dict "root" . "secret" $name "key" "password" "length" 32) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "kubehero.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: kubehero
  password: {{ $pw | quote }}
  database: kubehero
  url: {{ printf "clickhouse://kubehero:%s@%s-clickhouse.%s.svc:9000/kubehero" $pw $fullname .Release.Namespace | quote }}
{{- end }}

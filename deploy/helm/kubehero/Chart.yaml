apiVersion: v2
name: kubehero
description: KubeHero — open-source Kubernetes observability + FinOps in one install. Cost allocation, logs, continuous profiling, eBPF network cost, alerting, guarded rightsizing and read-only AI agents for AKS, GKE and EKS.
type: application
version: 0.3.3
appVersion: "0.3.3"
kubeVersion: ">=1.28-0"
maintainers:
  - name: KubeHero
    email: hello@kubehero.io
    url: https://kubehero.io
home: https://kubehero.io
sources:
  - https://github.com/kubehero-io/platform
keywords:
  - kubernetes
  - finops
  - opencost
  - observability
  - logs
  - profiling
  - ebpf
  - cost
  - rightsizing
annotations:
  category: monitoring
  licenses: BUSL-1.1 AND Apache-2.0

# ─── Subchart dependencies ────────────────────────────────────────────────
#
# Postgres and ClickHouse are built into this chart (templates/postgres.yaml,
# templates/clickhouse.yaml — official images), not subcharts. Every
# dependency below is optional and OFF by default, which keeps the chart
# installable offline / air-gapped without `helm dep update`. Flip an
# `embedded` value to true and re-run `helm dep update && helm upgrade
# --install` to pull the subchart in.
#
# Mature clusters typically already run most of these as peers — we
# install them via `infra/demo/stack-install.sh` for greenfield kind
# / GKE / EKS, and as proper subcharts here for ops teams that prefer
# a single helm release.
#
# Versions pinned to "tilde-major" so you get patch + minor updates
# inside the major series we tested against, but never an upstream
# major bump that breaks our values plumbing.

dependencies:
  - name: dex
    version: ">=0.18.0 <1.0.0"
    repository: "https://charts.dexidp.io"
    condition: auth.dex.embedded
    tags: [auth]
  - name: trivy-operator
    version: ">=0.20.0 <1.0.0"
    repository: "https://aquasecurity.github.io/helm-charts/"
    condition: security.trivy.embedded
    tags: [security]
  - name: tetragon
    version: ">=1.0.0 <2.0.0"
    repository: "https://helm.cilium.io"
    condition: security.tetragon.embedded
    tags: [security]
  - name: external-secrets
    version: ">=0.18.0 <1.0.0"
    repository: "https://charts.external-secrets.io"
    condition: secrets.externalSecrets.embedded
    tags: [secrets]
  - name: kube-prometheus-stack
    version: ">=60.0.0 <100.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.embedded
    tags: [observability]

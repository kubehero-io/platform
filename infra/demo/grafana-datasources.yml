apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    uid: kh-prom
  # KubeHero speaks the Loki query API: Grafana's stock Loki datasource
  # queries container logs stored in KubeHero's ClickHouse with LogQL.
  - name: KubeHero Logs
    type: loki
    url: http://control-plane:8080
    access: proxy
    uid: kh-logs
    jsonData:
      maxLines: 1000
